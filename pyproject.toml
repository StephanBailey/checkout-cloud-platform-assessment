[project]
name = "checkout-cloud-platform-assessment"
version = "0.1.0"
description = "Checkout API Lambda for the Cloud Platform Engineering assessment"
requires-python = ">=3.13"
dependencies = [
    "aws-lambda-powertools[validation,tracer]>=3.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
